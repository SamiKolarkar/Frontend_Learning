<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>The following is the table tag implememtation.</h4>
    <table border="1" cellspacing="0" cellpadding="10">
        <caption>Sample table</caption>
        <colgroup>
            <col span="1"/>
            <col span="1"/>
            <col span="1"/>
            <col span="2"/>
        </colgroup>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th colspan="2">Country</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>Smith</td>
                <td>35</td>
                <td colspan="2">USA</td>
            </tr>
            <tr>
                <td>Harry</td>
                <td>Depp</td>
                <td>28</td>
                <td>Maharashtra</td>
                <td rowspan="2">India</td>
            </tr>
            <tr>
                <td colspan="2">Ram Krishna</td>
                <td>19</td>
                <td>Delhi</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
